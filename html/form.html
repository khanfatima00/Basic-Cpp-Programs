<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Application Form</title>
    </head>
    <body>
        <h1><b>Students Registration Form</b></h1><br><br>
        <nav> Personal Details | Education  </nav>
        <br>
        <form>
            <feildset>
                <h3><legend>Personal Information</legend></h3>
                <br><br>

                <label>First Name:</label>
                <input type="text">
                <br><br>

                <label>Last Name:</label>
                <input type="text">
                <br><br>

                <label>Email:</label>
                <input type="email">
                <br><br>

                <label>Password</label>
                <input type="password">
                <br><br>

                <label>Age</label>
                <input type="number">
                <br><br>

            </feildset>
            <br><br>

            <feildset>
                <h3><legend>Education</legend></h3>
                <br><br>

                <label>Choose your Course:</label>
                <select>
                    <option>Computer Science</option>
                    <option>Information Technology</option>
                    <option>Instrumentation</option>
                    <option>Artificial Intelligence</option>
                    <option>Robotics</option>
                </select>
                <br><br>
            
                <label>About Yourself:</label>
                <br>
                <textarea rows="5" col="30"></textarea>
                <br><br>
                <feildset>
                 <br><br>

                 <label>City:</label>
                 <input list="cities">
                 <datalist id="cities">
                    <option value="Mumbai">
                    <option value="Delhi">
                    <option value="Pune">
                 </datalist>   
                 <br><br>

                 <button type="submit">Submit</button>
                 
                 <button type="reset">Reset</button>
                 <br><br>
                  
                 <output>Response Submitted!</output>
                 
        </form>
    </body>

</html>
